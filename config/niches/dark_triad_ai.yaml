# ─────────────────────────────────────────────────────────────────
seed_topics:
  # These are factually anchored — the number/institution is verified
  - "McKinsey says 300 million jobs will go to AI — here is which ones first"
  - "130 countries are building a CBDC right now — what happens when cash is gone"
  - "Nigeria banned cash withdrawals to force CBDC adoption — your country is next"
  - "Goldman Sachs: 25% of all work can be automated TODAY — are you in that 25%"
  - "The Enclosure Movement destroyed the commons — AI is doing the same to your career"
  - "4 to 12 percent of CEOs are clinical psychopaths — and they are building your future"
  - "Nvidia controls 80% of AI compute — one company, one chokepoint, total power"
  - "WEF projects 83 million jobs gone by 2027 — the 5-year countdown has started"
  - "BIS confirmed programmable money can block purchases — this is not theory anymore"
  - "The 10 richest people own more than 3 billion others — and AI will double that gap"
  - "How Standard Oil captured the railroads — and how OpenAI is doing the same with AI"
  - "Kardashev 0.73: humanity is almost Type 1 — but who controls the energy controls everything"
  - "India wiped out 86% of cash overnight in 2016 — here is the full playbook"
