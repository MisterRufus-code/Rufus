# ─────────────────────────────────────────────────────────────────
# CHANNEL PHILOSOPHY — FACTUAL FOUNDATION
# ─────────────────────────────────────────────────────────────────
# VERIFIED REAL-WORLD DATA POINTS (use these in scripts):
#
# LABOR DISPLACEMENT:
#   - McKinsey Global Institute (2023): 300 million full-time jobs globally
#     exposed to automation by generative AI
#   - Goldman Sachs (2023): 2/3 of US occupations partially automatable;
#     25% of current work tasks can be automated
#   - Oxford study (Frey & Osborne, 2013): 47% of US jobs at high risk
#   - WEF Future of Jobs 2023: 83 million jobs displaced by 2027
#   - OpenAI/UPenn (2023): GPT-4 exposes 80% of US workforce to some impact
#
# DIGITAL CURRENCY & CASH:
#   - 130+ countries representing 98% of world GDP exploring CBDCs (IMF, 2024)
#   - Nigeria's eNaira (2021): first African CBDC — adoption forced by
#     restricting ATM cash withdrawals
#   - Sweden Riksbank: cash transactions < 8% of all payments (2023)
#   - BIS (Bank for International Settlements) 2023 report: programmable
#     money can restrict what purchases are allowed
#   - India: 86% of cash demonetised overnight in 2016 (Modi shock)
#   - EU digital euro consultation: ECB explicitly states spending limits
#     will be programmable
#
# WEALTH CONCENTRATION:
#   - Forbes 2024: top 10 billionaires own more than bottom 3.1 billion people
#   - AI company valuations: OpenAI $80B+, Anthropic $18B+, Mistral $6B+
#     — all private, controlled by tiny shareholder groups
#   - Nvidia market cap surpassed $3 trillion (2024): single company controls
#     ~80% of AI training chip market
#   - Larry Fink (BlackRock CEO, 2024 letter): "AI is THE defining investment"
#
# KARDASHEV SCALE:
#   - Carl Sagan coined the concept (1973); Michio Kaku updated it
#   - Current human civilisation: ~0.73 on Kardashev scale (uses ~18 TW)
#   - Type 1 requires ~100 petawatts (planetary energy mastery)
#   - Futurists (Kurzweil, Kaku): Type 1 achievable by ~2200
#   - AGI prerequisite: virtually all Type 1 projections assume AI assistance
#
# DARK TRIAD IN POWER STRUCTURES:
#   - Babiak & Hare "Snakes in Suits" (2006): psychopathy rate in C-suites
#     estimated 4-12% vs 1% in general population
#   - Dutch study (Rijsenbilt 2011): narcissism index of Fortune 500 CEOs
#     positively correlated with fraud
#   - Machiavellian leadership: studies show high-Mach leaders outperform in
#     unregulated environments, underperform in stable ones
#   - Robert Hare PCL-R: corporate psychopathy 3.9% (Brooks, 2020 meta-analysis)
#
# HISTORICAL PARALLELS:
#   - Enclosure Movement (UK, 1500-1850): commons privatised, peasants
#     landless → factory labour with no alternative
#   - Railroad monopolies (US Gilded Age): 4 families controlled all rail;
#     Standard Oil controlled 91% of US oil refining by 1880
#   - Industrial Revolution: child labour, 16h days, poverty wages —
#     preceded by 50 years before labour laws corrected it
#
# Tone: investigative journalist meets geopolitical analyst.
# NOT conspiracy — every claim uses the data above.
# ─────────────────────────────────────────────────────────────────

# Ollama generation settings
# llama3.1 has a much larger context window and stronger instruction-following
# than mistral — critical for long structured scripts that stay on topic
model: llama3.1
script_style: >
  Investigative, urgent, and deeply researched. Write like a fearless
  journalist who has connected dots that mainstream media refuses to print.
  Anchor every claim to a specific real source: institution, year, number.
  Use real names and real data from the verified facts embedded in your
  system prompt. The tone is never hysterical — it is calm, precise, and
  devastating. The viewer should finish the video feeling informed and
  activated, not helpless or confused.
tone: calm urgency, intellectual authority, moral clarity

# ─────────────────────────────────────────────────────────────────
# SEED TOPICS (fed to the pipeline's topic rotation)
# ─────────────────────────────────────────────────────────────────
topic_boosters:
  - AI job automation collapse
  - digital currency surveillance state
  - end of physical cash
  - central bank digital currency CBDC
  - Kardashev scale AI civilisation
  - Dark Triad billionaires tech power
  - universal basic income trap
  - programmable money control
  - robot labor displacement workers
  - power elite AI monopoly
  - billionaire AI race
  - surveillance capitalism
  - wealth gap AI economy
  - oligarchy automation future
  - human labor obsolescence

