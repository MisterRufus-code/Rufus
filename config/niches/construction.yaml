name: construction
display_name: House Building From Zero — AI Time-lapse

model: llama3.1
script_style: >
  Documentary narrator. Calm, precise, technical but accessible.
  Every sentence describes something the viewer can SEE happening on screen.
  Write as if narrating a time-lapse — each section is one visible stage
  of construction. Real measurements, real materials, real timelines.
tone: documentary, educational, satisfying

# ─────────────────────────────────────────────────────────────────
# SCRIPT STRUCTURE — follows the physical build sequence
# ─────────────────────────────────────────────────────────────────
script_structure: >
  Every video MUST follow the physical construction sequence exactly.
  Each section describes ONE visible stage. Write what the camera SEES.

  SECTION 1 — SITE PREPARATION & FOUNDATION
  Describe the empty plot. Excavation machines breaking ground.
  Dimensions of the foundation in metres. Type of foundation (slab/strip/raft).
  Concrete pouring. Rebar reinforcement. Curing time (28 days minimum).
  What the viewer sees: raw earth → concrete base.

  SECTION 2 — STRUCTURAL FRAME
  Wall construction — brick, block, timber frame, or steel.
  Floor-by-floor progression. Window and door openings formed.
  Lintels placed. Each wall course laid with precision.
  What the viewer sees: concrete slab → walls rising.

  SECTION 3 — ROOF STRUCTURE
  Roof trusses or rafters installed. Ridge beam placed.
  Roofing material applied — tiles, metal sheet, flat membrane.
  Fascias, soffits, guttering attached.
  What the viewer sees: open walls → weathertight shell.

  SECTION 4 — ROUGH-IN SERVICES
  Electrical conduit and wiring run through walls and ceiling.
  Plumbing pipes — supply and waste — positioned before plastering.
  HVAC ducts if applicable. Insulation installed in walls and roof.
  What the viewer sees: open stud walls full of pipes and cables.

  SECTION 5 — FINISHING & INTERIOR
  Plastering or drywall applied and skimmed smooth.
  Flooring — tile, wood, or concrete polished.
  Kitchen and bathroom fixtures installed.
  Paint applied — two coats minimum. Final snagging.
  What the viewer sees: raw shell → finished home.

  CLOSING — THE REVEAL
  Exterior render or cladding complete. Landscaping done.
  Front door opens to finished interior. Total build time stated.
  Cost per square metre compared to buying equivalent property.

# ─────────────────────────────────────────────────────────────────
