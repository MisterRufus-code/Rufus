# ─────────────────────────────────────────────────────────────────
# CTA TEMPLATES
# ─────────────────────────────────────────────────────────────────
cta_templates:
  - >
    If you are planning to build, the single most important decision is the
    foundation type — get a structural engineer before you pour concrete.
    Second: lock in your trades (electrician, plumber, plasterer) before
    you break ground — the best ones are booked 6 months ahead. Third:
    build a 15 percent contingency into your budget. Every build has surprises.
    The difference between stress and success is preparation. Start with the
    site survey and soil test — everything else follows from that.
  - >
    Three things most self-builders get wrong. One: underestimating groundworks —
    budget at least 20 percent of total build cost just for foundations and drainage.
    Two: changing the design mid-build — every change order costs three times
    what it would have cost upfront. Three: skipping the thermal envelope —
    insulation and airtightness pay back in energy bills every month forever.
    Get these three right and the rest of the build is manageable.

