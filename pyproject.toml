[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rufus"
version = "1.0.0"
description = "100% free, fully local YouTube viral automation engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # LLM
    "httpx>=0.27.0",

    # Vision models
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.40.0",
    "ftfy>=6.1.3",
    "regex>=2023.12.25",
    "ultralytics>=8.2.0",
    "Pillow>=10.3.0",
    "opencv-python-headless>=4.9.0",

    # Vector database
    "qdrant-client>=1.9.0",
    "faiss-cpu>=1.8.0",

    # TTS
    "kokoro-onnx>=0.4.0",
    "soundfile>=0.12.1",

    # Footage
    "yt-dlp>=2024.1.0",

    # YouTube / Google
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",

    # Trends
    "pytrends>=4.9.2",

    # ML
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",

    # CLI / UI
    "click>=8.1.7",
    "rich>=13.7.0",

    # API server
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",

    # Config
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-anyio>=0.0.0",
    "httpx>=0.27.0",      # FastAPI TestClient
]

[project.scripts]
rufus = "main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
